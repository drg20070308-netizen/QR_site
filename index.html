<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>life.stylist 사진 다운로드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #5c4033;
      margin-bottom: 20px;
    }
    .photo-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }
    .photo-container {
      width: 100%;
      min-height: 350px;
      background: #f0ece1;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .photo-container img {
      width: 100%;
      height: auto;
      display: none; /* 초기에는 무조건 숨김 (랜덤 이미지 방지) */
    }
    .status-msg {
      font-size: 0.95rem;
      color: #666;
      padding: 20px;
      line-height: 1.5;
    }
    .error-msg {
      color: #e53e3e;
      font-weight: 500;
    }
    .brand-footer {
      font-size: 0.9rem;
      font-weight: 700;
      color: #5c4033;
      margin-top: 12px;
    }
    .sub-notice {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 16px;
    }
    .btn-download {
      width: 100%;
      padding: 16px;
      background-color: #d97736;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn-download:hover {
      background-color: #c26527;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">life.stylist</h1>

    <div class="photo-card">
      <div class="photo-container">
        <!-- 기본 로딩/에러 문구만 배치 (기본 이미지 absolute 제거) -->
        <p id="statusText" class="status-msg">사진을 불러오는 중입니다...</p>
        <img id="photoImg" src="" alt="내 코디 사진">
      </div>
      <p class="brand-footer">life.stylist</p>
    </div>

    <p class="sub-notice">버튼을 누르면 사진이 앨범에 저장됩니다.</p>

    <a id="downloadBtn" class="btn-download" href="#" download="life.stylist.png">
      사진 저장하기
    </a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // URL에서 photoUrl 파라미터 값 추출
      const urlParams = new URLSearchParams(window.location.search);
      const photoUrl = urlParams.get('photoUrl');

      const photoImg = document.getElementById('photoImg');
      const statusText = document.getElementById('statusText');
      const downloadBtn = document.getElementById('downloadBtn');

      // 1. 처음엔 이미지를 무조건 숨겨서 랜덤 예시 사진이 뜨지 못하게 함
      photoImg.style.display = 'none';
      downloadBtn.style.display = 'none';

      // 2. URL 파라미터로 올바른 사진 주소가 들어왔는지 검사
      if (photoUrl && photoUrl.trim() !== '') {
        
        // 브라우저 캐시 방지용 타임스탬프 파라미터 추가
        const cacheBustUrl = photoUrl + (photoUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

        // S3 이미지 로드 성공 시 실행
        photoImg.onload = () => {
          statusText.style.display = 'none'; // 메시지 숨김
          photoImg.style.display = 'block';  // 실제 내 사진만 출력
          
          downloadBtn.href = photoUrl;      // 저장 링크 연결
          downloadBtn.style.display = 'block';
        };

        // S3 이미지 로드 실패 시 (24시간 지나 삭제되었거나 잘못된 파일인 경우)
        photoImg.onerror = () => {
          statusText.textContent = "사진을 찾을 수 없거나 24시간이 지나 만료되었습니다.";
          statusText.className = "status-msg error-msg";
        };

        // 이미지 다운로드 시작
        photoImg.src = cacheBustUrl;
      } else {
        // 주소 뒤에 ?photoUrl=... 파라미터 없이 그냥 웹사이트에 들어온 경우
        statusText.textContent = "QR 코드로 접속하시면 사진을 확인하실 수 있어요!";
        statusText.style.color = "#000000"; // 글씨 색상을 검정색으로 지정
        statusText.className = "status-msg error-msg";
      }
    });
  </script>
</body>
</html>
