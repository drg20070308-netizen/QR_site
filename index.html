<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>life.stylist - 사진 다운로드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f5ef; /* 따뜻한 연갈색/크림 배경 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #4a3b32;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* 브랜드 타이틀 */
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #4a3b32;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 네컷사진 카드 틀 */
    .photo-card {
      background: #ffffff;
      padding: 16px 16px 20px 16px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(74, 59, 50, 0.08);
      margin-bottom: 24px;
    }

    /* 이미지 및 안내문구 영역 */
    .photo-wrapper {
      width: 100%;
      min-height: 380px;
      background-color: #f2eee5; /* 연한 베이지 */
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* 안내 메시지 */
    .status-msg {
      font-size: 0.95rem;
      color: #4a3b32;
      padding: 30px 20px;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* 하단 소제목/로고 표시 */
    .card-footer-logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4a3b32;
      margin-top: 4px;
    }

    /* 다운로드 버튼 */
    .download-btn {
      width: 100%;
      padding: 16px;
      background-color: #6b5344; /* 고급스러운 연갈색/브라운 버튼 */
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(107, 83, 68, 0.2);
      display: none;
    }

    .download-btn:active {
      background-color: #544034;
      transform: scale(0.99);
    }

    /* 모바일 안내 문구 */
    .tip-msg {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #8c7b70;
      display: none;
      word-break: keep-all;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="brand-title">life.stylist</h1>

    <div class="photo-card">
      <div class="photo-wrapper">
        <div id="statusText" class="status-msg">사진을 불러오는 중입니다...</div>
        <img id="photo" src="" alt="life.stylist photo" style="display: none;" crossorigin="anonymous">
      </div>
      <div class="card-footer-logo">life.stylist</div>
    </div>

    <button id="downloadBtn" class="download-btn" onclick="downloadPhoto()">사진 저장하기</button>
    <p id="tipMsg" class="tip-msg">버튼을 누르면 사진이 앨범(파일)에 저장됩니다.</p>
  </div>

  <script>
    // URL에서 photoUrl 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const photoUrl = urlParams.get('photoUrl');

    const photoImg = document.getElementById('photo');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    const tipMsg = document.getElementById('tipMsg');

    if (photoUrl) {
      photoImg.src = photoUrl;

      // 이미지 로드 성공 시
      photoImg.onload = () => {
        statusText.style.display = 'none';
        photoImg.style.display = 'block';
        downloadBtn.style.display = 'block';
        tipMsg.style.display = 'block';
      };

      // 이미지 로드 실패 시
      photoImg.onerror = () => {
        statusText.textContent = "사진을 찾을 수 없거나 24시간이 지나 만료되었습니다.";
        statusText.style.color = "#d9534f";
      };

    } else {
      // URL 파라미터가 없을 때
      statusText.textContent = "QR 코드로 접속하시면 사진을 확인하실 수 있어요! 📸";
      statusText.style.color = "#4a3b32";
      statusText.style.fontWeight = "bold";
    }

    // [사진 저장하기] 버튼 클릭 함수 (검증된 강제 다운로드 로직)
    async function downloadPhoto() {
      const currentPhotoUrl = photoImg.src;

      if (!currentPhotoUrl) {
        alert("저장할 사진이 없습니다.");
        return;
      }

      try {
        const response = await fetch(currentPhotoUrl, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `life_stylist_${Date.now()}.jpg`; // 파일 저장 이름
        
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

      } catch (error) {
        console.error("다운로드 실패:", error);
        
        // 예외 처리 (새 탭 열기)
        window.open(currentPhotoUrl, '_blank');
        alert("자동 다운로드가 안 될 경우, 새로 열린 창에서 사진을 길게 누르거나 우클릭하여 저장해 주세요!");
      }
    }
  </script>

</body>
</html>
