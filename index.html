<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네컷사진 다운로드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #1d1d1f;
      margin-bottom: 20px;
    }

    /* 이미지 표시 영역 */
    .photo-wrapper {
      width: 100%;
      min-height: 250px;
      background-color: #f0f0f2;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* 안내 메시지 */
    .status-msg {
      font-size: 0.95rem;
      color: #000000;
      padding: 20px;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 다운로드 버튼 */
    .download-btn {
      width: 100%;
      padding: 16px;
      background-color: #0071e3;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: none;
    }

    .download-btn:active {
      background-color: #005bb5;
    }

    /* 모바일 안내문구 */
    .tip-msg {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #86868b;
      display: none;
      word-break: keep-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📸 내 사진 저장하기</h1>

    <div class="photo-wrapper">
      <div id="statusText" class="status-msg">사진을 불러오는 중입니다...</div>
      <!-- crossorigin 속성 추가하여 CORS 이미지 처리 수월하게 설정 -->
      <img id="photo" src="" alt="촬영된 사진" style="display: none;" crossorigin="anonymous">
    </div>

    <button id="downloadBtn" class="download-btn" onclick="downloadPhoto()">사진 저장하기</button>
    <p id="tipMsg" class="tip-msg">💡 저장이 안 될 경우, 이미지 파일을 길게 누르거나 우클릭하여 '이미지 저장'을 눌러주세요.</p>
  </div>

  <script>
    // URL에서 photoUrl 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const photoUrl = urlParams.get('photoUrl');

    const photoImg = document.getElementById('photo');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    const tipMsg = document.getElementById('tipMsg');

    if (photoUrl) {
      photoImg.src = photoUrl;

      // 이미지 로드 성공
      photoImg.onload = () => {
        statusText.style.display = 'none';
        photoImg.style.display = 'block';
        downloadBtn.style.display = 'block';
        tipMsg.style.display = 'block';
      };

      // 이미지 로드 실패
      photoImg.onerror = () => {
        statusText.textContent = "사진을 불러올 수 없습니다. 링크가 만료되었거나 올바르지 않습니다.";
        statusText.style.color = "#e53e3e";
      };

    } else {
      statusText.textContent = "QR 코드로 접속하시면 사진을 확인하실 수 있어요! 📸";
      statusText.style.color = "#000000";
      statusText.style.fontWeight = "bold";
    }

    // [사진 저장하기] 버튼 클릭 함수 (CORS 전용 다운로드)
    async function downloadPhoto() {
      const currentPhotoUrl = photoImg.src;

      if (!currentPhotoUrl) {
        alert("저장할 사진이 없습니다.");
        return;
      }

      try {
        // mode: 'cors' 및 캐시 방지 옵션 추가
        const response = await fetch(currentPhotoUrl, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `photo_${Date.now()}.jpg`; // 컴퓨터/폰에 저장될 파일명
        
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

      } catch (error) {
        console.error("다운로드 실패:", error);
        
        // 다운로드 실패 시 예외 처리 (새 탭으로 사진 열기)
        window.open(currentPhotoUrl, '_blank');
        alert("자동 다운로드가 차단되었습니다. 새로 열린 창에서 마우스 우클릭 후 '이미지를 다른 이름으로 저장'을 선택해 주세요!");
      }
    }
  </script>

</body>
</html>
